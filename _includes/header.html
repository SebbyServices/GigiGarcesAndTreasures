<div class="announce">Handcrafted treasures, made in small batches</div>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">GigiG <span class="amp">&amp;</span> Treasures</a>

    <nav class="site-nav" aria-label="Main navigation">
      <ul>
        <li><a href="{{ '/catalog' | relative_url }}"{% if page.url contains '/catalog' %} class="active"{% endif %}>Pieces</a></li>
        <li><a href="{{ '/catalog' | relative_url }}#categories"{% if page.url contains '/catalog' %} aria-current="false"{% endif %}>Collections</a></li>
        <li><a href="{{ '/about' | relative_url }}"{% if page.url == '/about/' or page.url == '/about' %} class="active"{% endif %}>Meet Gigi</a></li>
        <li><a href="{{ '/blog' | relative_url }}"{% if page.url contains '/blog' %} class="active"{% endif %}>Journal</a></li>
        <li><a href="{{ '/contact' | relative_url }}"{% if page.url contains '/contact' %} class="active"{% endif %}>Contact</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      {% if page.layout == 'product' %}
      <a class="back-btn" href="{{ '/catalog' | relative_url }}">&larr; All Jewelry</a>
      {% endif %}
      <button class="nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-nav">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation" hidden>
    <ul>
      <li><a href="{{ '/catalog' | relative_url }}">Pieces</a></li>
      <li><a href="{{ '/catalog' | relative_url }}#categories">Collections</a></li>
      <li><a href="{{ '/about' | relative_url }}">Meet Gigi</a></li>
      <li><a href="{{ '/blog' | relative_url }}">Journal</a></li>
      <li><a href="{{ '/contact' | relative_url }}">Contact</a></li>
    </ul>
  </nav>
</header>
